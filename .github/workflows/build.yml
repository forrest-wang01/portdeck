name: build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore tests\PortDeck.Tests\PortDeck.Tests.csproj

      - name: Build
        run: dotnet build --no-restore -c Release

      - name: Test
        run: dotnet test tests\PortDeck.Tests\PortDeck.Tests.csproj --no-restore -c Release

      - name: Publish single-file exe
        run: >
          dotnet publish -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true
          -p:EnableCompressionInSingleFile=true
          -o dist

      - name: Upload portable exe
        uses: actions/upload-artifact@v4
        with:
          name: PortDeck-win-x64
          path: dist/PortDeck.exe
          if-no-files-found: error

  build-arm64:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore PortDeck.csproj

      - name: Publish ARM64 single-file exe
        run: >
          dotnet publish -c Release -r win-arm64 --self-contained true
          -p:PublishSingleFile=true
          -p:EnableCompressionInSingleFile=true
          -o dist-arm64

      - name: Upload ARM64 exe
        uses: actions/upload-artifact@v4
        with:
          name: PortDeck-win-arm64
          path: dist-arm64/PortDeck.exe
          if-no-files-found: error
