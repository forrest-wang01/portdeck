name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  actions: read
  contents: write

jobs:
  release:
    runs-on: windows-latest
    env:
      HAS_SIGNPATH: ${{ secrets.SIGNPATH_API_TOKEN != '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore tests\PortDeck.Tests\PortDeck.Tests.csproj

      - name: Test
        run: dotnet test tests\PortDeck.Tests\PortDeck.Tests.csproj --no-restore -c Release

      - name: Resolve version
        id: version
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart('v')
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Publish versioned single-file exes
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.version }}"
          dotnet publish -c Release -r win-x64 --self-contained true `
            -p:Version=$version `
            -p:PublishSingleFile=true `
            -p:EnableCompressionInSingleFile=true `
            -o dist
          Copy-Item "dist\PortDeck.exe" "dist\PortDeck-$version-win-x64.exe"
          Remove-Item "dist\PortDeck.exe"

          dotnet publish -c Release -r win-arm64 --self-contained true `
            -p:Version=$version `
            -p:PublishSingleFile=true `
            -p:EnableCompressionInSingleFile=true `
            -o dist-arm64
          Copy-Item "dist-arm64\PortDeck.exe" "dist-arm64\PortDeck-$version-win-arm64.exe"
          Remove-Item "dist-arm64\PortDeck.exe"

      - name: Validate SignPath settings
        if: env.HAS_SIGNPATH == 'true'
        shell: pwsh
        env:
          SIGNPATH_ORGANIZATION_ID: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          SIGNPATH_PROJECT_SLUG: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          SIGNPATH_SIGNING_POLICY_SLUG: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          SIGNPATH_ARTIFACT_CONFIGURATION_SLUG: ${{ vars.SIGNPATH_ARTIFACT_CONFIGURATION_SLUG }}
        run: |
          $missing = @()
          foreach ($name in @(
            "SIGNPATH_ORGANIZATION_ID",
            "SIGNPATH_PROJECT_SLUG",
            "SIGNPATH_SIGNING_POLICY_SLUG",
            "SIGNPATH_ARTIFACT_CONFIGURATION_SLUG"
          )) {
            if ([string]::IsNullOrWhiteSpace([Environment]::GetEnvironmentVariable($name))) {
              $missing += $name
            }
          }
          if ($missing.Count -gt 0) {
            throw "Missing SignPath repository variables: $($missing -join ', ')"
          }

      - name: Stage unsigned artifacts for SignPath
        if: env.HAS_SIGNPATH == 'true'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force signing-input | Out-Null
          Get-ChildItem "dist\PortDeck-*.exe", "dist-arm64\PortDeck-*.exe" |
            Copy-Item -Destination signing-input

      - name: Upload unsigned artifact
        if: env.HAS_SIGNPATH == 'true'
        id: upload-unsigned
        uses: actions/upload-artifact@v4
        with:
          name: portdeck-unsigned-${{ github.run_id }}
          path: signing-input/*.exe
          if-no-files-found: error
          retention-days: 1

      - name: Submit SignPath signing request
        if: env.HAS_SIGNPATH == 'true'
        id: signpath
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          artifact-configuration-slug: ${{ vars.SIGNPATH_ARTIFACT_CONFIGURATION_SLUG }}
          github-artifact-id: ${{ steps.upload-unsigned.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 1800
          output-artifact-directory: signed
          github-token: ${{ secrets.GITHUB_TOKEN }}
          parameters: |
            version: "${{ steps.version.outputs.version }}"

      - name: Replace with signed executables
        if: env.HAS_SIGNPATH == 'true'
        shell: pwsh
        run: |
          $signed = @(Get-ChildItem "signed\*.exe")
          if ($signed.Count -ne 2) {
            throw "Expected 2 signed executables, found $($signed.Count)."
          }

          foreach ($file in $signed) {
            $destination = if ($file.Name -like "*-win-arm64.exe") {
              Join-Path "dist-arm64" $file.Name
            } else {
              Join-Path "dist" $file.Name
            }
            Copy-Item $file.FullName $destination -Force

            $signature = Get-AuthenticodeSignature $destination
            if ($signature.Status -ne "Valid") {
              throw "Signature verification failed for $($file.Name): $($signature.Status)"
            }
            Write-Host "Signed and verified: $($file.Name)"
          }

      - name: Generate checksums
        shell: pwsh
        run: |
          $files = @(Get-ChildItem "dist\PortDeck-*.exe") + @(Get-ChildItem "dist-arm64\PortDeck-*.exe")
          foreach ($file in $files) {
            $hash = (Get-FileHash $file.FullName -Algorithm SHA256).Hash.ToLower()
            "$hash  $($file.Name)" | Set-Content "$($file.FullName).sha256" -Encoding ascii
            Get-Content "$($file.FullName).sha256"
          }

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: PortDeck ${{ github.ref_name }}
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          fail_on_unmatched_files: true
          files: |
            dist/PortDeck-*-win-x64.exe
            dist/PortDeck-*-win-x64.exe.sha256
            dist-arm64/PortDeck-*-win-arm64.exe
            dist-arm64/PortDeck-*-win-arm64.exe.sha256

      - name: Add code signing policy to release notes
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $headers = @{
            Authorization = "Bearer $env:GH_TOKEN"
            Accept = "application/vnd.github+json"
            "User-Agent" = "PortDeck-release"
          }
          $uri = "https://api.github.com/repos/${{ github.repository }}/releases/tags/${{ github.ref_name }}"
          $release = Invoke-RestMethod -Uri $uri -Headers $headers
          if ($release.body -match "SignPath Foundation") { return }
          $patchUri = "https://api.github.com/repos/${{ github.repository }}/releases/$($release.id)"

          $policy = @(
            "",
            "## Code signing policy",
            "",
            "Free code signing provided by [SignPath.io](https://about.signpath.io),",
            "certificate by [SignPath Foundation](https://signpath.org).",
            "",
            "Only the Windows x64 / ARM64 executables built from this repository by",
            "GitHub Actions are signed. See ``CODE_SIGNING_POLICY.md`` and ``PRIVACY.md``."
          ) -join "`n"
          $body = "$($release.body)$policy"
          Invoke-RestMethod -Method Patch -Uri $patchUri -Headers $headers `
            -Body (@{ body = $body } | ConvertTo-Json) `
            -ContentType "application/json" | Out-Null
